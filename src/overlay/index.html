<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.08);
    cursor: crosshair;
    overflow: hidden;
    user-select: none;
  }
  #hint {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    color: #fff;
    background: rgba(20, 20, 20, 0.9);
    padding: 10px 18px;
    border-radius: 8px;
    text-align: center;
    line-height: 1.45;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
  <div id="hint">
    Controlando el otro PC — mira esa pantalla (el cursor entra al centro del borde)<br />
    <span style="opacity:.75; font-size:12px">Mueve con libertad · Esc = volver · para volver por borde, empuja un poco más</span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
